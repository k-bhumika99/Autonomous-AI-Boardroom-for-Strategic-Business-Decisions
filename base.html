<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Autonomous AI Boardroom{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
<!-- Charting: loaded synchronously in <head>, before any inline chart script
     later in the body runs. Loading these at the bottom of the body (their
     previous location) meant every page's own inline chart script — which
     renders earlier in the document, inside the body content block — ran
     before window.BR existed, so no chart ever actually drew. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
{% block extra_head %}{% endblock %}
</head>
<body>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="flash-wrap" id="flash-wrap">
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  </div>
  <script>setTimeout(()=>{const w=document.getElementById('flash-wrap'); if(w) w.style.display='none';}, 4500);</script>
  {% endif %}
{% endwith %}

{% block body %}{% endblock %}

{% block extra_scripts %}{% endblock %}
</body>
</html>
